<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cinepedia - Jelajahi database film, rating, genre, dan informasi film favoritmu.">
    <title>Cinepedia — Explore Movies</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="#" class="brand" aria-label="Cinepedia Home">
            <span class="brand-icon">C</span>
            <span>CINE<span class="red-text">PEDIA</span></span>
        </a>

        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="search" id="searchInput" placeholder="Search movies, directors, genres..."
                aria-label="Cari film">
            <button id="clearSearch" class="clear-search" aria-label="Hapus pencarian">×</button>
        </div>

        <!-- Tombol login saja, belum memiliki fungsi navigasi -->
        <button type="button" class="login-btn">LOGIN</button>
    </header>

    <main class="container">

        <!-- PAGE HEADING -->
        <section class="page-heading">
            <div class="heading-title">
                <span class="heading-line"></span>
                <h1>EXPLORE MOVIES</h1>
                <span class="heading-divider"></span>
                <p>DATABASE ARCHIVE</p>
            </div>

            <div class="filter-tabs" role="group" aria-label="Filter film">
                <button class="filter-btn active" data-filter="all">ALL TITLES</button>
                <button class="filter-btn" data-filter="trending">TRENDING</button>
                <button class="filter-btn" data-filter="top-rated">TOP RATED</button>
                <button class="filter-btn" data-filter="Sci-Fi">SCI-FI</button>
                <button class="filter-btn" data-filter="Action">ACTION</button>
                <button class="filter-btn" data-filter="Drama">DRAMA</button>
            </div>
        </section>

        <!-- MOVIE GRID -->
        <section class="movie-section" aria-label="Daftar film">
            <div class="movie-grid" id="movieGrid"></div>

            <div class="empty-state" id="emptyState" hidden>
                <div class="empty-icon">⌕</div>
                <h2>Film tidak ditemukan</h2>
                <p>Coba kata kunci atau kategori yang berbeda.</p>
                <button type="button" id="resetSearch" class="reset-btn">
                    Tampilkan Semua Film
                </button>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <a href="#" class="brand footer-brand">
            <span class="brand-icon">C</span>
            <span>CINE<span class="red-text">PEDIA</span></span>
        </a>

        <p class="copyright">© 2026 Cinepedia. All rights reserved.</p>

        <nav class="footer-links" aria-label="Footer">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">API</a>
            <a href="#">Contact</a>
        </nav>
    </footer>

    <script src="script.js"></script>
</body>

</html>
